apiVersion: apps/v1
kind: Deployment
metadata:
  name: evaluation-service
  namespace: togglemaster
  labels:
    app: evaluation-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: evaluation-service
  template:
    metadata:
      labels:
        app: evaluation-service
    spec:
      containers:
        - name: evaluation-service
          image: 785077656057.dkr.ecr.us-east-1.amazonaws.com/evaluation-service:v1.0.0-04aab42
          ports:
            - containerPort: 8004
          envFrom:
            - secretRef:
                name: evaluation-service-secret
            - configMapRef:
                name: evaluation-service-config
          # OpenTelemetry: SDK configurado só por variáveis padrão OTEL_*.
          # Os pods enviam traces e métricas via OTLP/HTTP para o OTel Collector do próprio nó.
          env:
            - name: OTEL_SERVICE_NAME
              value: evaluation-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=togglemaster,deployment.environment.name=production
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8004
            initialDelaySeconds: 5
            periodSeconds: 10
