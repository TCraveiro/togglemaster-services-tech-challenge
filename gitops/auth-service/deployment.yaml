apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: togglemaster
  labels:
    app: auth-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: 211125689110.dkr.ecr.us-east-1.amazonaws.com/auth-service:v1.0.0-db17287
          ports:
            - containerPort: 8001
          envFrom:
            - secretRef:
                name: auth-service-secret
          # OpenTelemetry: SDK configurado só por variáveis padrão OTEL_*.
          # Os pods enviam traces e métricas via OTLP/HTTP para o OTel Collector do próprio nó.
          env:
            - name: OTEL_SERVICE_NAME
              value: auth-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=togglemaster,deployment.environment.name=production
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "300m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
