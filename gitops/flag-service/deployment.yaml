apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  namespace: togglemaster
  labels:
    app: flag-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flag-service
  template:
    metadata:
      labels:
        app: flag-service
    spec:
      containers:
        - name: flag-service
          image: 211125689110.dkr.ecr.us-east-1.amazonaws.com/flag-service:v1.0.0-db17287
          ports:
            - containerPort: 8002
          envFrom:
            - secretRef:
                name: flag-service-secret
            - configMapRef:
                name: flag-service-config
          # OpenTelemetry: SDK configurado só por variáveis padrão OTEL_*.
          # Os pods enviam traces e métricas via OTLP/HTTP para o OTel Collector do próprio nó.
          env:
            - name: OTEL_SERVICE_NAME
              value: flag-service
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: service.namespace=togglemaster,deployment.environment.name=production
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc.cluster.local:4318
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf
            # Logs continuam saindo no stdout (coletados pelo filelog do Collector), com trace_id/span_id
            - name: OTEL_LOGS_EXPORTER
              value: none
            - name: OTEL_PYTHON_LOG_CORRELATION
              value: "true"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"
            # Métricas HTTP no padrão estável (http.server.request.duration), igual aos serviços Go
            - name: OTEL_SEMCONV_STABILITY_OPT_IN
              value: http
            - name: OTEL_PYTHON_FLASK_EXCLUDED_URLS
              value: health
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              # Margem para o SDK do OpenTelemetry e as instrumentações
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8002
            initialDelaySeconds: 5
            periodSeconds: 10
