apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # Chart Helm oficial, com versão fixada
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 93.3.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/observability/values/kube-prometheus-stack.yaml
    # Values versionados neste repositório (referenciados como $values)
    - repoURL: https://github.com/TCraveiro/togglemaster-services-tech-challenge.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # CRDs do Prometheus Operator são grandes demais para o client-side apply
      - ServerSideApply=true
