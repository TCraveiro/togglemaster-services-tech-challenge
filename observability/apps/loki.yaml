apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  sources:
    # Chart Helm oficial, com versão fixada
    - repoURL: https://grafana.github.io/helm-charts
      chart: loki
      targetRevision: 7.6.0
      helm:
        releaseName: loki
        valueFiles:
          - $values/observability/values/loki.yaml
    # Values versionados neste repositório (referenciados como $values)
    - repoURL: https://github.com/TCraveiro/togglemaster-services-tech-challenge.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
